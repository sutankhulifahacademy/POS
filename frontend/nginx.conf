server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5M;

    # Hide Nginx version
    server_tokens off;

    # ==========================================================
    # SECURITY HEADERS
    # ==========================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;
    # HSTS — only meaningful over HTTPS, but harmless on HTTP
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json;

    gzip_min_length 1024;

    # ==========================================================
    # API -> FastAPI Backend
    # ==========================================================
    location /api/ {
        proxy_pass http://backend:8001/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ==========================================================
    # WEBSOCKET -> FastAPI Backend
    # ==========================================================
    location /api/ws/ {
        proxy_pass http://backend:8001/api/ws/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ==========================================================
    # STATIC ASSETS
    # ==========================================================
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ==========================================================
    # UPLOADED FILES — serve with nosniff and attachment disposition
    # ==========================================================
    location /api/uploads/ {
        proxy_pass http://backend:8001/api/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
    }

    # ==========================================================
    # REACT SPA
    # ==========================================================
    location / {
        try_files $uri $uri/ /index.html;
    }
}
